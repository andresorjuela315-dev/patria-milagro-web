        scheduled: ["Programada", "status-scheduled"],
        on_the_way: ["En camino", "status-on_the_way"],
        arrived: ["Llegó", "status-arrived"],
        waiting: ["Esperando asignación / ingreso", "status-waiting"],
        loading: ["En carga", "status-loading"],
        unloading: ["En descargue", "status-unloading"],
        completed: ["Finalizada", "status-completed"],
        cancelled: ["Cancelada", "status-cancelled"]
      };
      const STATUS_ORDER = ["scheduled", "on_the_way", "arrived", "loading", "completed"];
      const STATUS_OPTIONS = [
        ["scheduled","Programada"],["on_the_way","En camino"],["arrived","Llegó"],
        ["waiting","Esperando asignación / ingreso"],["loading","En carga"],
        ["unloading","En descargue"],["completed","Finalizada"],["cancelled","Cancelada"]
      ];
      const DRIVER_NAV = [
        ["home","⌂","Inicio"],["appointments","▦","Citas"],["location","⌖","Ubicación"],
        ["history","▤","Historial"],["profile","◉","Perfil"]
      ];
      const ADMIN_NAV = [
        ["home","▦","Dashboard"],["appointments","▤","Citas"],["operations","⇄","Operaciones"],
        ["drivers","♙","Conductores"],["profile","◉","Perfil"]
      ];

      function esc(value = "") {
        return String(value).replace(/[&<>"']/g, char => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        })[char]);
      }
      function initials(name = "") {
        return name.trim().split(/\s+/).slice(0,2).map(part=>part[0] || "").join("").toUpperCase() || "PM";
      }
      function statusBadge(status) {
        const entry = STATUS[status] || STATUS.scheduled;
        return `<span class="badge ${entry[1]}">${entry[0]}</span>`;
      }
      function dateTime(value) {
        if (!value) return "—";
        return new Intl.DateTimeFormat("es-CO",{dateStyle:"medium",timeStyle:"short"}).format(new Date(value));
      }
      function dateOnly(value) {
        if (!value) return "—";
        return new Intl.DateTimeFormat("es-CO",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(value));
      }
      function clockOnly(value) {
        if (!value) return "—";
        return new Intl.DateTimeFormat("es-CO",{hour:"2-digit",minute:"2-digit"}).format(new Date(value));
      }
      function localDateTimeInput(value) {
        const date = value ? new Date(value) : new Date(Date.now()+3600000);
        return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
      }
      function toast(message, isError = false) {
        toastRoot.innerHTML = `<div class="toast" role="status" style="${isError?"background:#8d3434":""}">${esc(message)}</div>`;
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(()=>{toastRoot.innerHTML="";},3600);
      }
      function setAuthMode(mode) {
        state.authMode = mode;
        render();
      }
      function renderAuth() {
        const signup = state.authMode === "signup";
        const recovery = state.authMode === "recovery";
        const title = signup ? "Crea tu cuenta" : recovery ? "Recupera tu acceso" : "Bienvenido de nuevo";
        const description = signup ? "Registra tus datos para coordinar tus citas logísticas." : recovery ? "Te enviaremos un enlace seguro a tu correo." : "Ingresa a tu espacio de operaciones.";
        const extraFields = signup ? `
          <div class="field-grid">
            <div class="field"><label for="full_name">Nombre completo</label><input id="full_name" name="full_name" required autocomplete="name" placeholder="Carlos Rodríguez"></div>
            <div class="field"><label for="identification">Número de identificación</label><input id="identification" name="identification" required autocomplete="off" placeholder="Número de documento"></div>
            <div class="field"><label for="phone">Número de teléfono</label><input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="+57 300 000 0000"></div>
            <div class="field"><label for="company">Empresa transportadora</label><input id="company" name="company" required placeholder="Nombre de empresa"></div>
            <div class="field"><label for="vehicle_plate">Placa del vehículo</label><input id="vehicle_plate" name="vehicle_plate" required placeholder="ABC-123"></div>
            <div class="field"><label for="vehicle_type">Tipo de vehículo</label><select id="vehicle_type" name="vehicle_type" required><option value="">Selecciona</option><option>Camión</option><option>Tractocamión</option><option>Camioneta</option><option>Furgón</option><option>Otro</option></select></div>
          </div>` : "";
        return `<main class="auth-layout">
          <section class="auth-hero">
            <div class="brand"><span class="brand-mark"><svg viewBox="0 0 48 48"><path d="M5 12h23v21H5zM28 19h8l7 8v6H28zM36 19v8h7"></path><circle cx="14" cy="36" r="4"></circle><circle cx="36" cy="36" r="4"></circle></svg></span><span>PATRIA MILAGRO</span></div>
            <div class="hero-copy"><span class="eyebrow">Logística que avanza</span><h1>Coordina cada <span>llegada.</span></h1><p>Menos filas, más control. Conecta conductores, empresas y muelles en una operación sencilla y puntual.</p>
              <svg class="hero-truck" viewBox="0 0 520 110" aria-hidden="true"><path fill="#7bb5df" d="M28 23h293a10 10 0 0 1 10 10v56H28a10 10 0 0 1-10-10V33a10 10 0 0 1 10-10Zm323 21h76l74 45H351V44Z"></path><path fill="#adcfe8" d="M365 53h52v25h-52zM426 53h17l42 25h-59z"></path><circle cx="105" cy="94" r="19" fill="#0c2746" stroke="#9ecbe9" stroke-width="7"></circle><circle cx="412" cy="94" r="19" fill="#0c2746" stroke="#9ecbe9" stroke-width="7"></circle></svg>
            </div>
            <div class="hero-footer">Una plataforma. Cada operación bajo control.</div>
          </section>
          <section class="auth-panel"><div class="auth-card">
            <h2>${title}</h2><p class="auth-description">${description}</p>
            <form id="auth-form" novalidate>
              ${extraFields}
              <div class="field"><label for="auth-email">Correo electrónico</label><input id="auth-email" name="email" type="email" required autocomplete="email" placeholder="correo@empresa.com"></div>
              ${!recovery?`<div class="field"><label for="auth-password">Contraseña</label><input id="auth-password" name="password" type="password" required minlength="8" autocomplete="${signup?"new-password":"current-password"}" placeholder="Mínimo 8 caracteres"></div>`:""}
              ${signup?`<div class="field"><label for="confirm-password">Confirmar contraseña</label><input id="confirm-password" name="confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="Escribe de nuevo tu contraseña"></div>`:""}
              <button class="primary-button wide" id="auth-submit" type="submit">${signup?"Crear cuenta":recovery?"Enviar enlace de recuperación":"Iniciar sesión"}</button>
              <p class="form-message" id="auth-message" role="status">${esc(state.error)}</p>
            </form>
            <div class="auth-links">${recovery?`<button class="link-button" data-auth-mode="login">Volver al inicio de sesión</button>`:`<button class="link-button" data-auth-mode="${signup?"login":"signup"}">${signup?"Ya tengo una cuenta":"Crear cuenta"}</button>${!signup?`<button class="link-button" data-auth-mode="recovery">¿Olvidaste tu contraseña?</button>`:""}`}</div>
          </div></section></main>`;
      }
      function navMarkup(items, mobile = false) {
        return `<nav class="${mobile?"mobile-nav":"side-nav"}" aria-label="${mobile?"Navegación inferior":"Navegación principal"}">${items.map(([id,icon,label])=>`<button class="nav-item" data-view="${id}" aria-current="${state.view===id?"page":"false"}"><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join("")}</nav>`;
      }
      function appointmentCard(appointment, admin = false) {
        const driver = appointment.driver || {};
        return `<article class="appointment-card">
          <div class="appointment-card-top"><div><h3>${esc(appointment.carrier_company || "Empresa por confirmar")}</h3><p>${esc(driver.full_name || appointment.driver_name || "Conductor pendiente")} · ${esc(driver.vehicle_plate || appointment.vehicle_plate || "Sin placa")}</p></div>${statusBadge(appointment.status)}</div>
          <div class="appointment-facts"><span>📅 ${esc(dateOnly(appointment.appointment_at))}</span><span>◷ ${esc(clockOnly(appointment.appointment_at))}</span><span>${appointment.operation_type==="unloading"?"⬇️ Descargue":"⬆️ Carga"}</span><span>▦ Muelle ${esc(appointment.dock || "Por asignar")}</span></div>
          <div class="button-row"><button class="secondary-button button-small" data-action="details" data-id="${esc(appointment.id)}">Ver detalles</button>${admin?`<button class="secondary-button button-small" data-action="edit" data-id="${esc(appointment.id)}">Editar</button>`:""}</div>
        </article>`;
      }
      function appointmentsForDriver() {
        return state.appointments.filter(item=>item.driver_id===state.user.id && !["completed","cancelled"].includes(item.status)).sort((a,b)=>new Date(a.appointment_at)-new Date(b.appointment_at));
      }
      function nextAppointment() { return appointmentsForDriver()[0] || null; }
      function dashboardStats() {
        const today = new Date().toDateString();
        const todayItems = state.appointments.filter(item=>new Date(item.appointment_at).toDateString()===today && item.status!=="cancelled");
        return [
          ["▦",todayItems.length,"Citas de hoy"],
          ["🚚",state.appointments.filter(item=>item.status==="on_the_way").length,"Conductores en camino"],
          ["◷",state.appointments.filter(item=>["arrived","waiting"].includes(item.status)).length,"Conductores en espera"],
          ["⇄",state.appointments.filter(item=>["loading","unloading"].includes(item.status)).length,"Operaciones en proceso"]
        ];
      }
      function homeView() {
        const admin = state.profile.role==="admin";
        const upcoming = admin ? state.appointments.slice().sort((a,b)=>new Date(a.appointment_at)-new Date(b.appointment_at)).slice(0,4) : appointmentsForDriver().slice(0,3);
        if (admin) return `<div class="welcome-row"><div><h2>Panel de control</h2><p>Resumen de las operaciones de tu empresa.</p></div><button class="primary-button" data-action="new-appointment">＋ Crear nueva cita</button></div>
          <div class="stats-grid">${dashboardStats().map(([icon,value,label])=>`<div class="stat-card"><span class="stat-icon">${icon}</span><div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div></div>`).join("")}<div class="stat-card"><span class="stat-icon">✓</span><div><div class="stat-value">${state.appointments.filter(x=>x.status==="completed").length}</div><div class="stat-label">Operaciones finalizadas</div></div></div></div>
          <div class="card"><div class="card-head"><div><h2>Llegadas programadas</h2><p>Actividad reciente de conductores y muelles</p></div><button class="link-button" data-view="appointments">Ver todas</button></div>${adminTable(upcoming)}</div>`;
        const next = nextAppointment();
        return `<div class="welcome-row"><div><h2>Hola, ${esc((state.profile.full_name||state.user.email.split("@")[0]).split(" ")[0])} 👋</h2><p>Aquí tienes el resumen de tu próxima operación.</p></div><span class="connection-pill"><span class="connection-dot"></span> Cuenta de conductor</span></div>
          ${next?`<section class="card appointment-hero"><span class="hero-label">PRÓXIMA CITA</span><h2>${esc(next.carrier_company||"Empresa logística")}</h2><p class="muted-light">${esc(dateTime(next.appointment_at))} · ${next.operation_type==="unloading"?"Descargue":"Carga"}</p><div class="appointment-meta"><div><span class="meta-label">HORA DE LLEGADA</span><span class="meta-value">${esc(clockOnly(next.appointment_at))}</span></div><div><span class="meta-label">MUELLE</span><span class="meta-value">${esc(next.dock||"Por asignar")}</span></div><div><span class="meta-label">ESTADO</span>${statusBadge(next.status)}</div></div><button class="primary-button" data-action="details" data-id="${esc(next.id)}">Ver detalles &nbsp; →</button></section>`:`<section class="card empty-state"><div><span>📅</span><strong>No tienes citas programadas todavía</strong><p>Cuando una empresa te asigne una cita, aparecerá aquí.</p></div></section>`}
          <section class="card" style="margin-top:17px"><div class="card-head"><div><h2>Accesos rápidos</h2><p>Encuentra lo que necesitas en un toque.</p></div></div><div class="quick-grid"><button class="quick-link" data-view="appointments"><span>📅</span>Mis citas</button><button class="quick-link" data-view="location"><span>📍</span>Ubicación</button><button class="quick-link" data-view="operations"><span>🚛</span>Operación</button><button class="quick-link" data-view="history"><span>📋</span>Historial</button></div></section>
          <section class="card" style="margin-top:17px"><div class="card-head"><div><h2>Actividad reciente</h2><p>El estado actual de tus citas.</p></div><button class="link-button" data-view="appointments">Ver citas</button></div><div class="appointment-list">${upcoming.length?upcoming.map(item=>appointmentCard(item)).join(""):`<div class="empty-state">Aún no tienes actividad para mostrar.</div>`}</div></section>`;
      }
      function adminTable(items) {
        if (!items.length) return `<div class="empty-state"><div><span>🚛</span>No hay llegadas programadas.<p>Usa «Crear nueva cita» para coordinar una operación.</p></div></div>`;
        return `<div class="table-wrap"><table><thead><tr><th>Conductor</th><th>Hora</th><th>Operación</th><th>Muelle</th><th>Estado</th><th></th></tr></thead><tbody>${items.map(item=>`<tr><td><strong>${esc(item.driver?.full_name||item.driver_name||"Pendiente")}</strong><br><span class="small-muted">${esc(item.vehicle_plate||item.driver?.vehicle_plate||"")}</span></td><td>${esc(dateTime(item.appointment_at))}</td><td>${item.operation_type==="unloading"?"Descargue":"Carga"}</td><td>${esc(item.dock||"—")}</td><td>${statusBadge(item.status)}</td><td><button class="secondary-button button-small" data-action="details" data-id="${esc(item.id)}">Abrir</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function appointmentListView() {
        const admin = state.profile.role==="admin";
        const term = state.search.trim().toLowerCase();
        let items = state.appointments.slice();
        if (!admin) items = items.filter(item=>item.driver_id===state.user.id);
        if (state.filter==="Finalizadas") items=items.filter(item=>item.status==="completed");
        if (state.filter==="Hoy") items=items.filter(item=>new Date(item.appointment_at).toDateString()===new Date().toDateString());
        if (state.filter==="Próximas") items=items.filter(item=>new Date(item.appointment_at)>=new Date()&&!["completed","cancelled"].includes(item.status));
        if (term) items=items.filter(item=>(item.driver?.full_name||item.driver_name||"").toLowerCase().includes(term)||(item.carrier_company||"").toLowerCase().includes(term)||(item.vehicle_plate||"").toLowerCase().includes(term));
        items.sort((a,b)=>new Date(a.appointment_at)-new Date(b.appointment_at));
        return `<div class="welcome-row"><div><h2>${admin?"Gestión de citas":"Mis citas"}</h2><p>${admin?"Organiza horarios, muelles y conductores.":"Consulta el estado de tus próximas operaciones."}</p></div>${admin?`<button class="primary-button" data-action="new-appointment">＋ Crear nueva cita</button>`:""}</div>
          <div class="toolbar"><div class="filter-row">${["Todas","Hoy","Próximas","Finalizadas"].map(filter=>`<button class="filter-chip" data-filter="${filter}" aria-pressed="${state.filter===filter}">${filter}</button>`).join("")}</div>${admin?`<input class="toolbar-input" id="appointment-search" type="search" value="${esc(state.search)}" placeholder="Buscar conductor, placa o empresa">`:""}</div>
          <div class="appointment-list">${items.length?items.map(item=>appointmentCard(item,admin)).join(""):`<section class="card empty-state"><div><span>📅</span>No encontramos citas con este filtro.</div></section>`}</div>`;
      }
      function progressMarkup(status) {
        const active = STATUS_ORDER.indexOf(status);
        const actual = status==="waiting" ? 2 : status==="unloading" ? 3 : active;
        const labels=["Programada","En camino","Llegada","Carga","Finalizada"];
        return `<div class="progress-line">${labels.map((label,index)=>`<div class="progress-step ${index<actual?"done":index===actual?"current":""}"><span class="progress-dot">${index<actual?"✓":index+1}</span><span>${label}</span></div>`).join("")}</div>`;
      }
      function detailView() {
        const item = state.appointments.find(entry=>entry.id===state.selectedAppointmentId);
        if (!item) return `<section class="card empty-state"><div>No se encontró la cita.<p><button class="secondary-button" data-view="appointments">Volver a citas</button></p></div></section>`;
        const admin=state.profile.role==="admin";
        const driverName=item.driver?.full_name||item.driver_name||state.profile.full_name||"Conductor";
        return `<div class="welcome-row"><div><button class="link-button" data-view="appointments">← Volver a ${admin?"citas":"mis citas"}</button><h2 style="margin-top:8px">Detalle de cita</h2></div>${statusBadge(item.status)}</div>
          <section class="card"><div class="card-head"><div><h2>${esc(item.carrier_company||"Centro Logístico Patria")}</h2><p>Coordinación logística · ${item.operation_type==="unloading"?"Descargue":"Carga"}</p></div>${admin?`<button class="secondary-button button-small" data-action="edit" data-id="${esc(item.id)}">Editar cita</button>`:""}</div>
            <div class="detail-grid"><div class="detail-item"><span>Fecha y hora de llegada</span><strong>${esc(dateTime(item.appointment_at))}</strong></div><div class="detail-item"><span>Tipo de operación</span><strong>${item.operation_type==="unloading"?"Descargue":"Carga"}</strong></div><div class="detail-item"><span>Conductor</span><strong>${esc(driverName)}</strong></div><div class="detail-item"><span>Vehículo / placa</span><strong>${esc(item.driver?.vehicle_type||"Vehículo")} · ${esc(item.vehicle_plate||item.driver?.vehicle_plate||"—")}</strong></div><div class="detail-item"><span>Muelle asignado</span><strong>${esc(item.dock||"Por asignar")}</strong></div><div class="detail-item"><span>Dirección</span><strong>${esc(item.carrier_company||"Centro Logístico Patria")}</strong></div></div>
            ${item.notes?`<p class="small-muted" style="margin-top:15px"><strong>Observaciones:</strong> ${esc(item.notes)}</p>`:""}
            <h3 style="margin:24px 0 0;font-size:.9rem">Progreso de la operación</h3>${progressMarkup(item.status)}
            ${admin?`<div class="field"><label for="admin-status">Actualizar estado</label><div class="toolbar-group"><select class="toolbar-input" id="admin-status">${STATUS_OPTIONS.map(([value,label])=>`<option value="${value}" ${value===item.status?"selected":""}>${label}</option>`).join("")}</select><button class="primary-button button-small" data-action="save-status" data-id="${esc(item.id)}">Guardar estado</button></div></div><div class="button-row" style="margin-top:14px"><button class="secondary-button button-small" data-action="edit" data-id="${esc(item.id)}">Cambiar horario o muelle</button>${item.status!=="cancelled"&&item.status!=="completed"?`<button class="danger-button button-small" data-action="cancel" data-id="${esc(item.id)}">Cancelar cita</button>`:""}</div>`:driverActions(item)}
          </section>`;
      }
      function driverActions(item) {
        if (item.status==="scheduled") return `<button class="primary-button" data-action="status" data-id="${esc(item.id)}" data-status="on_the_way">🚚 Estoy en camino</button>`;
        if (item.status==="on_the_way") return `<button class="primary-button" data-action="arrival" data-id="${esc(item.id)}">📍 Confirmar llegada</button>`;
        if (["arrived","waiting"].includes(item.status)) return `<p class="small-muted">Tu llegada quedó registrada. Espera las instrucciones del centro logístico.</p>`;
        if (["loading","unloading"].includes(item.status)) return `<button class="primary-button" data-action="status" data-id="${esc(item.id)}" data-status="completed">✓ Finalizar operación</button>`;
        return `<p class="small-muted">Esta operación ya finalizó.</p>`;
      }
      function operationView() {
        const active=state.appointments.filter(item=>(state.profile.role==="admin"||item.driver_id===state.user.id)&&["arrived","waiting","loading","unloading"].includes(item.status));
        if (!active.length) return `<div class="welcome-row"><div><h2>Operaciones en proceso</h2><p>Seguimiento de carga y descargue en tiempo real.</p></div>${state.profile.role==="admin"?`<button class="primary-button" data-action="new-appointment">＋ Crear nueva cita</button>`:""}</div><section class="card empty-state"><div><span>🚛</span>No hay operaciones activas en este momento.</div></section>`;
        return `<div class="welcome-row"><div><h2>Operación en proceso</h2><p>Seguimiento del estado y la asignación de muelles.</p></div></div><div class="appointment-list">${active.map(item=>`<section class="card"><div class="card-head"><div><h2>${esc(item.carrier_company||"Centro Logístico Patria")}</h2><p>${esc(item.driver?.full_name||item.driver_name||state.profile.full_name||"Conductor")} · ${esc(item.vehicle_plate||item.driver?.vehicle_plate||"")}</p></div>${statusBadge(item.status)}</div><div class="detail-grid"><div class="detail-item"><span>Vehículo</span><strong>${esc(item.driver?.vehicle_type||"Camión")}</strong></div><div class="detail-item"><span>Placa</span><strong>${esc(item.vehicle_plate||item.driver?.vehicle_plate||"—")}</strong></div><div class="detail-item"><span>Muelle</span><strong>${esc(item.dock||"Por asignar")}</strong></div><div class="detail-item"><span>Tipo</span><strong>${item.operation_type==="unloading"?"Descargue":"Carga"}</strong></div><div class="detail-item"><span>Hora de inicio</span><strong>${esc(clockOnly(item.started_at||item.arrived_at))}</strong></div></div><div style="margin-top:18px">${progressMarkup(item.status)}</div><div class="button-row"><button class="secondary-button button-small" data-action="details" data-id="${esc(item.id)}">Ver operación</button>${state.profile.role==="admin"?`<button class="primary-button button-small" data-action="details" data-id="${esc(item.id)}">Actualizar operación</button>`:""}</div></section>`).join("")}</div>`;
      }
      function locationView() {
        const coords=state.mapPosition;

primary-button button-small" data-action="locate">📍 Compartir mi ubicación</button><a class="secondary-button button-small" target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/search?query=Centro%20Log%C3%ADstico%20Patria">Iniciar navegación ↗</a></div></section></div>`;

      function profileView() {
        const profile=state.profile;
        return `<div class="welcome-row"><div><h2>Mi perfil</h2><p>Administra tus datos de contacto y vehículo.</p></div></div><section class="card"><div class="profile-header"><span class="avatar">${esc(initials(profile.full_name))}</span><div><h2>${esc(profile.full_name||"Usuario Patria Milagro")}</h2><p>${profile.role==="admin"?"Administrador de empresa":"Conductor"} · ${esc(profile.company||"Empresa por registrar")}</p></div></div><div class="detail-grid"><div class="detail-item"><span>Correo electrónico</span><strong>${esc(state.user.email)}</strong></div><div class="detail-item"><span>Identificación</span><strong>${esc(profile.identification||"No registrada")}</strong></div><div class="detail-item"><span>Teléfono</span><strong>${esc(profile.phone||"No registrado")}</strong></div><div class="detail-item"><span>Empresa</span><strong>${esc(profile.company||"No registrada")}</strong></div><div class="detail-item"><span>Placa del vehículo</span><strong>${esc(profile.vehicle_plate||"No registrada")}</strong></div><div class="detail-item"><span>Tipo de vehículo</span><strong>${esc(profile.vehicle_type||"No registrado")}</strong></div></div><div class="button-row" style="margin-top:18px"><button class="primary-button button-small" data-action="edit-profile">Editar perfil</button><button class="secondary-button button-small" data-view="settings">Configuración</button></div></section>`;
      }
      function settingsView() {
        return `<div class="welcome-row"><div><h2>Configuración</h2><p>Preferencias de tu cuenta Patria Milagro.</p></div></div><section class="card"><div class="settings-row"><div><strong>Notificaciones</strong><p class="small-muted">Preferencia local para avisos en esta aplicación.</p></div><button class="filter-chip" data-action="toggle-notifications" aria-pressed="${state.notification}">${state.notification?"Activadas":"Desactivadas"}</button></div><div class="settings-row"><div><strong>Cuenta</strong><p class="small-muted">${esc(state.user.email)} · ${state.profile.role==="admin"?"Administrador":"Conductor"}</p></div><button class="danger-button button-small" data-action="sign-out">Cerrar sesión</button></div></section>`;

      function driversView() {
        return `<div class="welcome-row"><div><h2>Conductores</h2><p>Perfiles registrados en Patria Milagro.</p></div></div><section class="card">${state.drivers.length?`<div class="table-wrap"><table><thead><tr><th>Conductor</th><th>Empresa</th><th>Teléfono</th><th>Vehículo</th><th>Placa</th></tr></thead><tbody>${state.drivers.map(driver=>`<tr><td><strong>${esc(driver.full_name||"Sin nombre")}</strong><br><span class="small-muted">${esc(driver.email||"")}</span></td><td>${esc(driver.company||"—")}</td><td>${esc(driver.phone||"—")}</td><td>${esc(driver.vehicle_type||"—")}</td><td>${esc(driver.vehicle_plate||"—")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty-state"><div><span>♙</span>No hay perfiles de conductor todavía.</div></div>`}</section>`;
      }
      function mainView() {
        const views={
          home:homeView,
          appointments:appointmentListView,
          detail:detailView,
          operations:operationView,
          location:locationView,
          history:historyView,
          profile:profileView,
          settings:settingsView,
          drivers:driversView
        };

      }
      function renderApp() {
        const admin=state.profile.role==="admin";
        const nav=admin?ADMIN_NAV:DRIVER_NAV;
        const name=state.profile.full_name||state.user.email;
        const content=state.loading?`<section class="card empty-state"><div><span>⏳</span>Cargando datos seguros de tu cuenta...</div></section>`:state.error?`<section class="card empty-state"><div><span>⚠️</span>${esc(state.error)}<p><button class="secondary-button" data-action="reload">Reintentar</button></p></div></section>`:mainView();
        return `<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 48 48"><path d="M5 12h23v21H5zM28 19h8l7 8v6H28zM36 19v8h7"></path><circle cx="14" cy="36" r="4"></circle><circle cx="36" cy="36" r="4"></circle></svg></span><span>PATRIA MILAGRO</span></div><div class="workspace-label">${admin?"Espacio de empresa":"Espacio del conductor"}</div>${navMarkup(nav)}<div class="sidebar-bottom"><div class="workspace-label">CUENTA</div><button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Configuración</span></button><div class="sidebar-user"><span class="avatar">${esc(initials(name))}</span><div class="user-copy"><strong>${esc(name)}</strong><span>${admin?"Administrador":"Conductor"}</span></div></div></div></aside>
          <div class="main-area"><header class="topbar"><div><h1>Patria Milagro</h1><p>Gestión inteligente de operaciones logísticas</p></div><div class="top-actions"><span class="connection-pill"><span class="connection-dot"></span> Conectado</span><button class="icon-button" data-view="profile" aria-label="Abrir perfil">◉</button></div></header><main class="page-content">${content}</main></div>${navMarkup(nav,true)}</div>`;
      }
      function render() {
        appRoot.innerHTML=state.session&&state.profile?renderApp():renderAuth();
      }
      async function loadAppData() {
        state.loading=true; state.error=""; render();
        try {
          const {data:profile,error:profileError}=await supabase.from("profiles").select("*").eq("id",state.user.id).single();
          if (profileError) throw new Error(`No se pudo cargar tu perfil: ${profileError.message}. Verifica que instalaste schema.sql.`);
          state.profile=profile;
          const {data:appointments,error:appointmentError}=await supabase.from("appointments").select("*, driver:profiles!appointments_driver_id_fkey(id,full_name,phone,company,vehicle_plate,vehicle_type,email)").order("appointment_at",{ascending:true});
          if (appointmentError) throw new Error(`No se pudieron cargar las citas: ${appointmentError.message}`);
          state.appointments=appointments||[];
          if (profile.role==="admin") {
            const {data:drivers,error:driversError}=await supabase.from("profiles").select("id,full_name,email,phone,company,vehicle_plate,vehicle_type").eq("role","driver").order("full_name");
            if (driversError) throw new Error(`No se pudo cargar el directorio de conductores: ${driversError.message}`);
            state.drivers=drivers||[];
          }
        } catch(error) {
          state.profile=null; state.error=error instanceof Error?error.message:"No se pudieron cargar los datos.";
        } finally {
          state.loading=false; render();
        }
      }
      async function refreshData() {
        await loadAppData();
      }
      async function saveAppointment(formData, appointmentId) {
        const driverId=formData.get("driver_id")||null;
        const driver=state.drivers.find(person=>person.id===driverId);
        const {error}=await supabase.rpc("admin_save_appointment",{
          p_id:appointmentId,
          p_driver_id:driverId,
          p_driver_name:formData.get("driver_name")||driver?.full_name||null,
          p_carrier_company:String(formData.get("carrier_company")||"").trim(),
          p_vehicle_plate:String(formData.get("vehicle_plate")||driver?.vehicle_plate||"").trim(),
          p_appointment_at:new Date(String(formData.get("appointment_at"))).toISOString(),
          p_operation_type:formData.get("operation_type"),
          p_dock:String(formData.get("dock")||"").trim()||null,
          p_notes:String(formData.get("notes")||"").trim()||null
        });
        if (error) throw error;
        await refreshData();
        state.view=appointmentId?"detail":"appointments";
        render();
        toast(appointmentId?"Cita actualizada correctamente.":"Cita programada correctamente.");
      }
      function openAppointmentModal(appointment) {
        const editing=Boolean(appointment);
        modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="appointment-modal-title"><div class="modal-head"><h2 id="appointment-modal-title">${editing?"Editar cita":"Crear nueva cita"}</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">×</button></div><p class="small-muted">Asigna conductor, horario y muelle para la operación.</p><form id="appointment-form" data-id="${editing?esc(appointment.id):""}">
          <div class="field"><label for="driver_id">Conductor</label><select id="driver_id" name="driver_id"><option value="">Sin asignar por ahora</option>${state.drivers.map(driver=>`<option value="${esc(driver.id)}" ${appointment?.driver_id===driver.id?"selected":""}>${esc(driver.full_name||driver.email)} · ${esc(driver.vehicle_plate||"Sin placa")}</option>`).join("")}</select></div>
          <div class="field-grid"><div class="field"><label for="driver_name">Nombre del conductor (si aún no tiene cuenta)</label><input id="driver_name" name="driver_name" value="${esc(appointment?.driver_name||"")}" placeholder="Nombre completo"></div><div class="field"><label for="carrier_company">Empresa transportadora</label><input id="carrier_company" name="carrier_company" required value="${esc(appointment?.carrier_company||state.profile.company||"")}" placeholder="Centro Logístico Patria"></div>
          <div class="field"><label for="vehicle_plate">Placa</label><input id="vehicle_plate" name="vehicle_plate" value="${esc(appointment?.vehicle_plate||"")}" placeholder="ABC-123"></div><div class="field"><label for="appointment_at">Fecha y hora de llegada</label><input id="appointment_at" name="appointment_at" type="datetime-local" required value="${localDateTimeInput(appointment?.appointment_at)}"></div>
          <div class="field"><label for="operation_type">Tipo de operación</label><select id="operation_type" name="operation_type"><option value="loading" ${appointment?.operation_type!=="unloading"?"selected":""}>Carga</option><option value="unloading" ${appointment?.operation_type==="unloading"?"selected":""}>Descargue</option></select></div><div class="field"><label for="dock">Muelle</label><select id="dock" name="dock"><option value="">Por asignar</option>${Array.from({length:12},(_,index)=>String(index+1).padStart(2,"0")).map(dock=>`<option value="${dock}" ${appointment?.dock===dock?"selected":""}>Muelle ${dock}</option>`).join("")}</select></div></div>
          <div class="field"><label for="notes">Observaciones</label><textarea id="notes" name="notes" placeholder="Indicaciones de acceso o carga">${esc(appointment?.notes||"")}</textarea></div><p class="form-message" id="modal-message"></p><div class="button-row" style="justify-content:flex-end"><button class="secondary-button" type="button" data-action="close-modal">Cancelar</button><button class="primary-button" type="submit">${editing?"Guardar cambios":"Programar cita"}</button></div></form></section></div>`;
        modalRoot.querySelector("#driver_id").addEventListener("change",event=>{
          const driver=state.drivers.find(person=>person.id===event.target.value);
          if (driver) {
            modalRoot.querySelector("#driver_name").value=driver.full_name||"";
            modalRoot.querySelector("#vehicle_plate").value=driver.vehicle_plate||"";
            if (!modalRoot.querySelector("#carrier_company").value) modalRoot.querySelector("#carrier_company").value=driver.company||"";
          }
        });
      }
      function openProfileModal() {
        const profile=state.profile;
        modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title"><div class="modal-head"><h2 id="profile-modal-title">Editar perfil</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">×</button></div><form id="profile-form"><div class="field-grid"><div class="field"><label for="profile-name">Nombre completo</label><input id="profile-name" name="full_name" required value="${esc(profile.full_name||"")}"></div><div class="field"><label for="profile-id">Identificación</label><input id="profile-id" name="identification" value="${esc(profile.identification||"")}"></div><div class="field"><label for="profile-phone">Teléfono</label><input id="profile-phone" name="phone" type="tel" value="${esc(profile.phone||"")}"></div><div class="field"><label for="profile-company">Empresa</label><input id="profile-company" name="company" value="${esc(profile.company||"")}"></div><div class="field"><label for="profile-plate">Placa del vehículo</label><input id="profile-plate" name="vehicle_plate" value="${esc(profile.vehicle_plate||"")}"></div><div class="field"><label for="profile-vehicle">Tipo de vehículo</label><select id="profile-vehicle" name="vehicle_type">${["Camión","Tractocamión","Camioneta","Furgón","Otro"].map(type=>`<option ${profile.vehicle_type===type?"selected":""}>${type}</option>`).join("")}</select></div></div><p class="form-message" id="modal-message"></p><div class="button-row" style="justify-content:flex-end"><button class="secondary-button" type="button" data-action="close-modal">Cancelar</button><button class="primary-button" type="submit">Guardar perfil</button></div></form></section></div>`;
      }
      async function updateStatus(id,status) {
        const appointment=state.appointments.find(item=>item.id===id);
        if (!appointment) return;
        const now=new Date().toISOString();
        const record={status};
        if (status==="arrived"||status==="waiting") {record.arrived_at=now; record.status="waiting";}
        if (status==="loading"||status==="unloading") record.started_at=appointment.started_at||now;
        if (status==="completed") record.completed_at=now;
        const {error}=await supabase.from("appointments").update(record).eq("id",id);
        if (error) throw error;
        await refreshData();
        state.view="detail"; state.selectedAppointmentId=id; render();
        toast(status==="waiting"?"Llegada registrada correctamente. Estado: esperando asignación / ingreso.":status==="on_the_way"?"La empresa ya sabe que estás en camino.":status==="completed"?"Operación finalizada. Se guardó en tu historial.":"Estado de la operación actualizado.");
      }
      async function performAction(actionButton) {
        const action=actionButton.dataset.action;
        const id=actionButton.dataset.id;
        if (action==="new-appointment") return openAppointmentModal();
        if (action==="edit") {const item=state.appointments.find(entry=>entry.id===id);if(item)return openAppointmentModal(item);}
        if (action==="edit-profile") return openProfileModal();
        if (action==="details") {state.selectedAppointmentId=id;state.view="detail";render();return;}
        if (action==="status") return updateStatus(id,actionButton.dataset.status);
        if (action==="arrival") {
          const item=state.appointments.find(entry=>entry.id===id);
          return openConfirmModal("¿Ya llegaste al centro logístico?",`<div class="detail-grid"><div class="detail-item"><span>Empresa</span><strong>${esc(item?.carrier_company||"Centro Logístico Patria")}</strong></div><div class="detail-item"><span>Hora programada</span><strong>${esc(clockOnly(item?.appointment_at))}</strong></div><div class="detail-item"><span>Hora actual</span><strong>${esc(clockOnly(new Date()))}</strong></div><div class="detail-item"><span>Muelle asignado</span><strong>${esc(item?.dock||"Por asignar")}</strong></div></div>`,"Confirmar llegada",async()=>updateStatus(id,"arrived"));
        }
        if (action==="save-status") return updateStatus(id,modalRoot.dataset.status||document.querySelector("#admin-status").value);
        if (action==="cancel") return openConfirmModal("¿Cancelar esta cita?","El conductor ya no verá esta cita como una operación activa.","Sí, cancelar cita",async()=>updateStatus(id,"cancelled"));
        if (action==="close-modal") {modalRoot.innerHTML="";return;}
        if (action==="sign-out") return signOut();
        if (action==="reload") return refreshData();
        if (action==="toggle-notifications") {state.notification=!state.notification;localStorage.setItem("patria-notifications",state.notification?"on":"off");render();toast(state.notification?"Preferencia de avisos activada.":"Preferencia de avisos desactivada.");return;}
        if (action==="locate") {
          if (!navigator.geolocation) return toast("Este dispositivo no permite consultar la ubicación.",true);
          actionButton.disabled=true;actionButton.textContent="Consultando ubicación…";
          navigator.geolocation.getCurrentPosition(position=>{state.mapPosition={latitude:position.coords.latitude,longitude:position.coords.longitude};render();toast("Ubicación actualizada en este dispositivo.");},error=>{actionButton.disabled=false;actionButton.textContent="📍 Compartir mi ubicación";toast(error.code===1?"Permite el acceso a la ubicación para usar esta función.":"No se pudo obtener la ubicación. Inténtalo de nuevo.",true);},{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
        }
      }
      function openConfirmModal(title,body,confirmLabel,callback) {
        modalRoot.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="Cerrar">×</button></div>${body}<div class="button-row" style="justify-content:flex-end;margin-top:22px"><button class="secondary-button" data-action="close-modal">Cancelar</button><button class="primary-button" id="confirm-action">${esc(confirmLabel)}</button></div></section></div>`;
        modalRoot.querySelector("#confirm-action").addEventListener("click",async buttonEvent=>{
          const button=buttonEvent.currentTarget;button.disabled=true;
          try {await callback();modalRoot.innerHTML="";} catch(error) {button.disabled=false;toast(error.message||"No se pudo completar la acción.",true);}
        });
      }
      async function signOut() {
        const {error}=await supabase.auth.signOut();
        if(error)throw error;
        state.session=null;state.user=null;state.profile=null;state.appointments=[];state.drivers=[];state.view="home";state.error="";render();
      }
      async function handleAuthSubmit(form) {
        const data=new FormData(form);
        const email=String(data.get("email")||"").trim();
        const password=String(data.get("password")||"");
        const message=form.querySelector("#auth-message");
        const submit=form.querySelector("#auth-submit");
        message.textContent="";submit.disabled=true;
        try {
          if(state.authMode==="signup") {
            if(password!==data.get("confirm-password")) throw new Error("Las contraseñas no coinciden.");
            const driverProfile={
              full_name:String(data.get("full_name")||"").trim(),
              identification:String(data.get("identification")||"").trim(),
              phone:String(data.get("phone")||"").trim(),
              company:String(data.get("company")||"").trim(),
              vehicle_plate:String(data.get("vehicle_plate")||"").trim().toUpperCase(),
              vehicle_type:String(data.get("vehicle_type")||"")
            };
            const {data:result,error}=await supabase.auth.signUp({email,password,options:{data:driverProfile,emailRedirectTo:window.location.href.split("#")[0]}});
            if(error)throw error;
            if(result.session) {state.session=result.session;state.user=result.user;await loadAppData();return;}
            toast("Cuenta creada. Confirma tu correo electrónico con el enlace que enviamos.");
            setAuthMode("login");return;
          }
          if(state.authMode==="recovery") {
            const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.href.split("#")[0]});
            if(error)throw error;
            toast("Si la cuenta existe, recibirás un enlace para restablecer la contraseña.");
            setAuthMode("login");return;
          }
          const {data:result,error}=await supabase.auth.signInWithPassword({email,password});
          if(error)throw error;
          state.session=result.session;state.user=result.user;state.view="home";await loadAppData();
        } catch(error) {message.textContent=authError(error);}
        finally {if(submit.isConnected)submit.disabled=false;}
      }
      function authError(error) {
        const text=String(error?.message||"");
        if(/invalid login credentials/i.test(text))return "El correo o la contraseña son incorrectos.";
        if(/email not confirmed/i.test(text))return "Confirma tu correo electrónico desde el enlace que te enviamos.";
        if(/user already registered/i.test(text))return "Ya existe una cuenta con ese correo.";
        if(/email rate limit/i.test(text))return "Se alcanzó el límite de correos. Inténtalo más tarde.";
        return text||"No se pudo completar la solicitud. Inténtalo de nuevo.";
      }
      appRoot.addEventListener("submit",async event=>{
        const form=event.target;
        if(form.id==="auth-form") {event.preventDefault();await handleAuthSubmit(form);}
        if(form.id==="appointment-form") {
          event.preventDefault();
          const button=form.querySelector('button[type="submit"]');button.disabled=true;
          try {await saveAppointment(new FormData(form),form.dataset.id||null);modalRoot.innerHTML="";}
          catch(error) {form.querySelector("#modal-message").textContent=error.message||"No se pudo guardar la cita.";button.disabled=false;}
        }
      });
      modalRoot.addEventListener("submit",async event=>{
        if(event.target.id!=="profile-form")return;
        event.preventDefault();
        const form=event.target;const button=form.querySelector('button[type="submit"]');button.disabled=true;
        const updates=Object.fromEntries(new FormData(form).entries());
        try {
          const {error}=await supabase.from("profiles").update({...updates,vehicle_plate:String(updates.vehicle_plate||"").trim().toUpperCase()||null}).eq("id",state.user.id);
          if(error)throw error;
          modalRoot.innerHTML="";await refreshData();toast("Perfil actualizado.");
        } catch(error) {form.querySelector("#modal-message").textContent=error.message||"No se pudo guardar el perfil.";button.disabled=false;}
      });
      document.addEventListener("click",async event=>{
        const button=event.target.closest("button,[data-action='close-modal']");
        if(!button)return;
        if(button.dataset.authMode) {state.error="";setAuthMode(button.dataset.authMode);return;}
        if(button.dataset.view) {state.view=button.dataset.view;state.search="";render();return;}
        if(button.dataset.filter) {state.filter=button.dataset.filter;render();return;}
        if(button.dataset.action==="save-status") {try {await updateStatus(button.dataset.id,document.querySelector("#admin-status").value);}catch(error){toast(error.message,true);}return;}
        if(button.dataset.action) {
          try {await performAction(button);} catch(error) {toast(error.message||"No se pudo completar la acción.",true);}
        }
      });
      appRoot.addEventListener("input",event=>{
        if(event.target.id==="appointment-search") {state.search=event.target.value;const position=event.target.selectionStart;render();const input=document.querySelector("#appointment-search");input.focus();input.setSelectionRange(position,position);}
      });
      modalRoot.addEventListener("click",event=>{
        if(event.target.classList.contains("modal-backdrop"))modalRoot.innerHTML="";
      });
      async function bootstrap() {
        render();
        const {data,error}=await supabase.auth.getSession();
        if(error) {state.error=error.message;render();return;}
        state.session=data.session;state.user=data.session?.user||null;
        if(state.user) await loadAppData(); else render();
        supabase.auth.onAuthStateChange((event,session)=>{
          if(event==="PASSWORD_RECOVERY") {toast("Enlace verificado. Actualiza tu contraseña desde tu perfil.");return;}
          if(event==="SIGNED_OUT") {state.session=null;state.user=null;state.profile=null;state.appointments=[];render();}
          else if(session?.user&&session.user.id!==state.user?.id) {state.session=session;state.user=session.user;void loadAppData();}
        });
      }
      bootstrap();
    </script>
  </body>
</html>
